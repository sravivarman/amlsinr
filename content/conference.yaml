tracks:
- title: 'Track 1: Applied Machine Learning and Edge Intelligence (AML)'
  bullets:
  - '1.1 Foundation Models and Deep Learning Architectures: Deep learning, neural
    networks, foundation models, transfer learning, multimodal learning, and intelligent
    computational architectures for complex infrastructure and networked systems.'
  - '1.2 Computer Vision, Language Intelligence, and Explainable AI: Object detection,
    vision-based infrastructure inspection, video analytics, natural language processing
    for engineering logs and threat intelligence, explainable AI, model interpretability,
    and AI-supported system diagnostics.'
  - '1.3 Edge Intelligence, TinyML, and Real-Time Autonomous Control: Edge computing,
    TinyML, resource-constrained machine learning, real-time autonomous control loops,
    reinforcement learning, and intelligent decision-making for cyber-physical systems.'
  - '1.4 Big Data Engineering and Multimodal Analytics: Distributed analytics, cloud
    and edge infrastructure, large-scale data processing, multimodal data fusion,
    scalable machine-learning pipelines, and energy-efficient, carbon-aware AI computing
    including model compression and training/inference optimization.'
- title: 'Track 2: Sustainable Infrastructure and Smart Engineering (SI)'
  bullets:
  - '2.1 Smart Grids and Renewable Energy Systems: Smart grids, distributed renewable-energy
    systems, microgrid control, energy forecasting, energy storage, demand response,
    energy management, and energy-harvesting sensor networks.'
  - '2.2 Structural Health Monitoring and Digital Twins: IoT-driven structural health
    monitoring for bridges, dams, buildings, tunnels, and other infrastructure assets;
    predictive maintenance; digital twins; infrastructure inspection, and asset lifecycle
    management.'
  - '2.3 Climate-Resilient Infrastructure and Disaster Modeling: Climate-resilient
    infrastructure planning, vulnerability assessment, extreme-event forecasting,
    disaster risk prediction, climate-impact modeling, AI-supported emergency management,
    macro-level environmental forecasting, emissions tracking, and precision agriculture.'
  - '2.4 Intelligent Water, Waste, and Transportation Systems: AI for smart water
    systems, water-quality monitoring, wastewater and waste management, intelligent
    transportation systems, connected and autonomous vehicles, traffic and mobility
    optimization, and data-driven policy for smart cities and circular-economy operations.'
- title: 'Track 3: Network Resilience and Cyber-Physical Security (NR)'
  bullets:
  - '3.1 Industrial Control and Critical Infrastructure Security: Intrusion detection
    and prevention systems, ICS and SCADA security, operational technology protection,
    industrial protocol security, cyber-physical attack detection, and critical infrastructure
    defense.'
  - '3.2 Adversarial AI and Secure Model Defense: Protection of AI models against
    data poisoning, evasion attacks, backdoor attacks, model extraction, adversarial
    examples, model manipulation, and other threats targeting machine-learning systems.'
  - '3.3 Software-Defined Networks and Resilient 5G/6G Systems: SDN security, programmable
    networks, resilient 5G/6G network slicing, adaptive routing, network telemetry,
    distributed network defense, communication reliability, and self-healing network
    architectures.'
  - '3.4 Zero-Trust, Cryptography, and Distributed Ledger Technologies: Cryptographic
    protocols, identity-aware access control, zero-trust architectures, privacy-preserving
    communication, blockchain-based distributed ledgers, immutable audit trails, smart
    contracts, and secure coordination for cyber-physical systems.'
